name: Build HSK Academy Vivo APK
on:
  push:
    branches:
      - hsk-academy-apk
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Put APK in branch for direct download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HSK_Academy_Vivo.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HSK_Academy_Vivo.apk
          git commit -m '[skip ci] Add ready-to-install APK'
          git push origin HEAD:hsk-academy-apk
      - uses: actions/upload-artifact@v4
        with:
          name: HSK_Academy_Vivo_APK
          path: HSK_Academy_Vivo.apk
